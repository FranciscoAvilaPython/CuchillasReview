name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Descargar fuente D-DIN
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/D-DIN.ttf https://raw.githubusercontent.com/amcchord/datto-d-din/main/D-DIN.ttf
          curl -fsSL -o fonts/D-DIN-Bold.ttf https://raw.githubusercontent.com/amcchord/datto-d-din/main/D-DIN-Bold.ttf
          file fonts/D-DIN.ttf fonts/D-DIN-Bold.ttf

      - name: Firma fija (actualizaciones sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Generar proyecto Android
        run: flutter create . --platforms android --project-name cuchillas

      - name: Dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: cuchillas-apk
          path: build/app/outputs/flutter-apk/app-release.apk
