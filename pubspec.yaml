name: cuchillas
description: Control visual de desgaste de cuchillas de maquinaria. 100% offline.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  image_picker: ^1.0.7
  sensors_plus: ^4.0.2

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
